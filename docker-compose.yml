networks:
  promise-network:
    external: true

services:
  web:
    build: .
    command: bash -c "bundle check || bundle install; bundle exec rails db:prepare; rm -f tmp/pids/server.pid && bin/dev"
    stdin_open: true
    environment:
      # Leave PROMISE_KEY_REGISTRY_API_ROOT unset in local dev so the on-disk
      # fake Key Registry (config/initializers/dev_key_registry.rb) is used and
      # no separate KMS service is required. Set it to a real KMS URL when needed.
      RAILS_ENV: development
      NODE_ENV: development
      RAILS_BIND: 0.0.0.0
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    ports:
      - "3003:3000"
    networks:
      - promise-network

volumes:
  postgres_data:
  bundle_cache:
  node_modules:
